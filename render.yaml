services:
  - type: web
    name: backend-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npx prisma generate --schema prisma/schema.prisma
    startCommand: npm run start:render
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_VERSION
        value: v1
      - key: ALLOWED_ORIGINS
        value: https://magasotomayor18-star.github.io,http://localhost:5500,http://127.0.0.1:5500
      - key: PAGINATION_DEFAULT_LIMIT
        value: "20"
      - key: PAGINATION_MAX_LIMIT
        value: "100"
      - key: DATABASE_URL
        fromDatabase:
          name: clase12nov
          property: connectionString

databases:
  - name: clase12nov
    databaseName: clase12nov
    user: clase12nov_user
    plan: free
    region: oregon
    postgresMajorVersion: "16"
